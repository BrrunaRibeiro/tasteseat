<!DOCTYPE html>
<html lang="en" style="contain: content;">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'images/apple-touch-icon.png' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'images/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'images/favicon-16x16.png' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <title>TasteSeat</title>
</head>
<body>
    <nav class="NavBar container-fluid">
        <ul class="NavItems navbar g-0" style="list-style-type: none;">
            <li>
                <a href="{% url 'restaurant_list' %}"
                    class="logo">
                    TasteSeat</a>
            </li>
            <li>
                <a href="{% url 'restaurant_list' %}" class="nav-link px-2 link-body-emphasis" contenteditable="false"
                    style="cursor: pointer;">Restaurants</a>
            </li>
            <li>
                <button type="button" class="btn btn-outline-dark me-2"><a href="{% url 'my_bookings' %}">My
                        Bookings</a></button>
            </li>
        </ul>
    </nav>
    {% block content %}
    {% endblock %}
    <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
    <footer>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="{% static 'js/scripts.js' %}"></script>
</body>
</html>
